<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Senha Segura</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🔐 Gerador de Senha</h1>

    <input type="range" id="length" min="4" max="12" value="8" oninput="mostrarValor(this.value)">
    <p>Tamanho: <span id="valor-tamanho">8</span></p>

    <label>
        <input type="checkbox" id="numbers"> Incluir Números
    </label>

    <label>
        <input type="checkbox" id="symbols"> Incluir Símbolos
    </label>

    <button onclick="generatePassword()">Gerar Senha</button>

    <h2 id="result"></h2>

    <h3>Histórico</h3>
    <ul id="historico"></ul>

    <button onclick="limparHistorico()">Limpar Histórico</button>
    <button onclick="copiarSenha()">Copiar Senha</button>

    <p id="copiado-msg"></p>

    <hr>

    <div class="forca-container">
        <div id="forca-barra"></div>
    </div>
    <p id="forca-texto"></p>

<ul id="checklist">
  <li id="check-length">✖ Mínimo 12 caracteres</li>
  <li id="check-lower">✖ Letra minúscula</li>
  <li id="check-upper">✖ Letra maiúscula</li>
  <li id="check-number">✖ Número</li>
  <li id="check-symbol">✖ Símbolo</li>
</ul>

<p id="tempo-quebra"></p>



    <h1>🔍︎ Validador de Senha</h1>
    <input type="text" id="passwordCheck" placeholder="Digite uma senha">
    <button onclick="validatePassword()">Validar</button>

    <h2 id="strength"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
